<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SO/CO</title>
<meta name="description" content="Pilotage SO/CO : cap, chiffre d'affaires, production et discipline quotidienne.">
<meta name="theme-color" content="#1B1B1B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SO/CO">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ====== APPLICATION (masquée à l'impression) ====== -->
<div id="app">

  <header class="topbar">
    <img class="brand" src="assets/logo.png" alt="SO/CO">
    <div class="tb-title">
      <h1 id="viewTitle">Jour</h1>
      <p id="viewSub"></p>
    </div>
    <button class="icon-btn" id="btnPrint" title="Imprimer les posters A3" aria-label="Imprimer les posters A3">⎙</button>
  </header>

  <div id="backupBanner" class="banner hidden" role="status">
    <span id="backupMsg"></span>
    <button class="btn btn-sm" id="btnBannerSave">Sauvegarder</button>
  </div>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" role="tablist">
    <button class="tab" data-view="jour"      role="tab"><span class="ti">✓</span><span>Jour</span></button>
    <button class="tab" data-view="pilotage"  role="tab"><span class="ti">€</span><span>Pilotage</span></button>
    <button class="tab" data-view="prod"      role="tab"><span class="ti">▤</span><span>Prod</span></button>
    <button class="tab" data-view="nord"      role="tab"><span class="ti">✦</span><span>Nord</span></button>
    <button class="tab" data-view="reglages"  role="tab"><span class="ti">⚙</span><span>Réglages</span></button>
  </nav>

  <div id="toast" class="toast hidden" role="status"></div>
</div>

<!-- ====== POSTERS A3 (visibles uniquement à l'impression) ====== -->
<div id="printroot"></div>

<input type="file" id="fileImport" accept="application/json,.json" hidden>

<script src="app.js"></script>
</body>
</html>
